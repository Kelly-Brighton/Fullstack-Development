<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <div id="app">
        <button class="cart" @click="toggleCart" :disabled="!canShowCart">Cart: ({{ numberOfItems }})</button>

        <main>
            <div v-if="displayCart">
                <h2>Shopping Cart</h2>
                <p>Available in cart: {{ numberOfItems }}</p>
            </div>

            <div v-else>
                <h1>{{ heading }}</h1>
                <div class="pet-grid">

                    <div class="pet-card">

                        <figure class="pet-image">
                            <img v-bind:src="product.image" alt="Pet Image" width="300">
                        </figure>

                        <div class="pet-details">
                            <h2 class="pet-title" v-text="product.title"></h2>
                            <p class="pet-description" v-text="product.description"></p>
                            <p class="pet-price">Price: £{{ product.price }}</p>
                            <p class="pet-inventory">Available Inventory: {{ product.availableInventory }}</p>
                            <button class="add-to-cart" v-on:click="addToCart()" :disabled="!canAddItem">Add to
                                Cart</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        const { createApp } = Vue
        const petStore = createApp({
            data() {
                return {
                    heading: 'Welcome to the Pet Shop!',
                    product: {
                        title: 'Cute Cat',
                        description: 'A friendly and playful cat looking for a loving home.',
                        price: 199.99,
                        image: "images/cat.jpg",
                        availableInventory: 5
                    },
                    cartItems: [],
                    displayCart: false
                }
            },
            computed: {
                canAddItem() {
                    return this.product.availableInventory > 0;
                },
                numberOfItems() {
                    return this.cartItems.length;
                },
                canShowCart() {
                    return this.cartItems.length > 0;
                }
            },
            methods: {
                addToCart() {
                    if (this.canAddItem) {
                        this.cartItems.push(this.product);
                        this.product.availableInventory--;
                    }
                },
                toggleCart() {
                    this.displayCart = !this.displayCart;
                }
            },
        })
        petStore.mount('#app')
    </script>
</body>

</html>
