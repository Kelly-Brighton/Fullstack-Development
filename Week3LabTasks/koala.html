<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    

<div id= 'app'>

    <p>First Name: <input v-model="firstName"></p>
    <p>Last Name: <input v-model="lastName"></p>

    <p>Full Name: {{fullName}}</p>

    <img v-bind:src="animal.image" v-bind:alt="animal.alt" v-bind:width="animal.width" v-bind:height="animal.height">
    <p>Image width: <input v-model="animal.width"></p>
    <p>Image height: <input v-model="animal.height"></p>
</div>

    <script type = "module">
        const {createApp} = Vue
        const myApp = createApp({
            data(){
                return {
                    firstName: "Mark",
                    lastName: "Jones",
                    animal: {
                        name:"koala",
                        image:"images/koalaSmall.jpg",
                        alt: "A cuddly koala",
                        width:300,
                        height: 200
                    }
                }
            },
            computed:{
                fullName:function(){
                    return this.firstName + " " + this.lastName;
                }
            }
        })
        myApp.mount('#app')
    </script>

    
</body>
</html>
